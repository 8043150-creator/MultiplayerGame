
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEON ARENA - MONSTER MAYHEM</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080b18;color:white;font-family:Arial,sans-serif;overflow:hidden}
header{height:54px;background:#11172b;border-bottom:1px solid #303958;display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.logo{font-size:18px;font-weight:1000;letter-spacing:2px}
.logo span{color:#a78bfa}
.actions{display:flex;gap:7px}
button{cursor:pointer;color:white;background:#222a43;border:1px solid #465171;border-radius:8px;padding:8px 13px}
button:hover{filter:brightness(1.3)}
#hud{min-height:62px;background:#11172b;display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;padding:7px}
.stat{background:#202843;border:1px solid #394564;padding:8px 12px;border-radius:8px;font-size:12px;color:#b9c4e2}
.stat b{color:white}
#stage{height:calc(100vh - 116px);position:relative;display:flex;align-items:center;justify-content:center;padding:5px}
canvas{width:min(100%,1200px);height:100%;object-fit:contain;border:1px solid #48557c;border-radius:9px;background:#11182b}
#overlay{position:absolute;inset:0;background:#080b18df;backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:15px;z-index:5}
.panel{background:#171e34;border:1px solid #6654a1;border-radius:17px;padding:28px;width:95%;max-width:470px;text-align:center;box-shadow:0 0 50px #7547d233}
.panel h1{color:#c4b5fd;font-size:30px;margin:0 0 12px}
.panel p{color:#b0b8d2;font-size:13px;line-height:1.7}
.panel button{background:linear-gradient(100deg,#803cf0,#2768ed);border:0;padding:13px 30px;margin-top:17px;font-weight:bold}
#info{line-height:2;margin:13px 0;font-size:12px;color:#cbd3ea}
#results{margin-top:12px}
.result{display:flex;justify-content:space-between;padding:9px;border-bottom:1px solid #ffffff18;font-size:13px}
#message{position:absolute;top:18px;left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:20px;background:#29254c;border:1px solid #a78bfa;color:white;font-size:12px;opacity:0;transition:.2s;z-index:3;pointer-events:none;white-space:nowrap}
#bossBar{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:min(450px,75%);display:none;text-align:center;z-index:2}
#bossBar label{font-size:11px;letter-spacing:2px;text-shadow:0 2px 4px black}
.track{height:12px;background:#36172c;border:1px solid #fb7185;border-radius:20px;margin-top:5px;overflow:hidden}
#bossFill{height:100%;width:100%;background:linear-gradient(90deg,#e11d48,#fb7185)}
@media(max-width:650px){
 header{height:48px;padding:0 8px}
 .logo{font-size:14px}
 #hud{gap:4px}
 .stat{padding:6px;font-size:10px}
 #stage{height:calc(100vh - 105px)}
 .panel{padding:19px}
}
</style>
</head>
<body>
<header>
 <div class="logo">⚔ NEON <span>ARENA</span></div>
 <div class="actions">
  <button onclick="pauseGame()">Ⅱ PAUSE</button>
  <button onclick="home()">EXIT</button>
 </div>
</header>

<div id="hud">
 <div class="stat">ARENA <b id="arenaName">NEON CITY</b></div>
 <div class="stat">WAVE <b id="wave">1/5</b></div>
 <div class="stat">MONSTERS <b id="monsterCount">0</b></div>
 <div class="stat">COINS <b id="coins">0</b></div>
 <div class="stat">TEAM LEVEL <b id="level">1</b></div>
</div>

<div id="stage">
 <canvas id="game" width="1200" height="720"></canvas>
 <div id="bossBar"><label id="bossName">BOSS</label><div class="track"><div id="bossFill"></div></div></div>
 <div id="message"></div>
 <div id="overlay">
  <div class="panel">
   <h1 id="title">MONSTER MAYHEM</h1>
   <p id="description">Prepare for battle!</p>
   <div id="info"></div>
   <div id="results"></div>
   <button id="mainButton" onclick="startGame()">ENTER ARENA</button>
  </div>
 </div>
</div>

<script>
"use strict";

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const W=1200,H=720;
const params=new URLSearchParams(location.search);

const count=Math.max(1,Math.min(4,Number(params.get("players"))||1));
const arena=params.get("arena")||"city";
const heroChoices=(params.get("heroes")||"0,1,2,3").split(",").map(Number);

const heroData=[
 {name:"VIOLET",color:"#a855f7",dark:"#54218c",damage:23,speed:245,emoji:"🛡"},
 {name:"AZURE",color:"#38bdf8",dark:"#15517b",damage:18,speed:285,emoji:"⚔"},
 {name:"SUNNY",color:"#facc15",dark:"#946400",damage:29,speed:220,emoji:"🔥"},
 {name:"SCARLET",color:"#fb7185",dark:"#872a48",damage:26,speed:230,emoji:"💥"}
];

const controls=[
 {up:"w",down:"s",left:"a",right:"d",attack:"f",dash:"g",label:"WASD · F ATTACK · G DASH"},
 {up:"arrowup",down:"arrowdown",left:"arrowleft",right:"arrowright",attack:"/",dash:".",label:"ARROWS · / ATTACK · . DASH"},
 {up:"i",down:"k",left:"j",right:"l",attack:"u",dash:"o",label:"IJKL · U ATTACK · O DASH"},
 {up:"t",down:"g",left:"f",right:"h",attack:"y",dash:"r",label:"TFGH · Y ATTACK · R DASH"}
];

// Player movement keys and attack keys are intentionally different.
// P4 uses G for movement down, so P4 dash is R.

const themes={
 city:{
  name:"NEON CITY",floor:"#111a32",grid:"#25385a",
  glow:"#a855f7",obstacle:"#293b61",accent:"#38bdf8",
  obstacleType:"city"
 },
 lava:{
  name:"LAVA TEMPLE",floor:"#281817",grid:"#563026",
  glow:"#fb6540",obstacle:"#66332a",accent:"#ffb454",
  obstacleType:"lava"
 },
 ice:{
  name:"FROZEN BASE",floor:"#10263b",grid:"#274c67",
  glow:"#67d9f8",obstacle:"#355a78",accent:"#d3f5ff",
  obstacleType:"ice"
 }
};

const theme=themes[arena]||themes.city;

let players=[];
let enemies=[];
let pickups=[];
let particles=[];
let obstacles=[];
let keys={};
let state="intro";
let wave=1;
let coins=0;
let teamXP=0;
let teamLevel=1;
let remaining=0;
let spawnClock=0;
let breakTime=0;
let shake=0;
let last=0;
let elapsed=0;
let toastTimeout=null;

const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

function makePlayers(){
 players=[];
 const spots=[[470,350],[730,350],[600,260],[600,450]];
 for(let i=0;i<count;i++){
  const h=heroData[clamp(heroChoices[i]||0,0,3)];
  players.push({
   id:i+1,hero:h,
   x:spots[i][0],y:spots[i][1],
   hp:100,maxHP:100,lives:3,
   speed:h.speed,damage:h.damage,
   score:0,xp:0,level:1,
   facing:0,attackTime:0,attackCooldown:0,
   dashTime:0,dashCooldown:0,
   invuln:0,downTime:0,alive:true,
   hitIds:new Set(),moving:false
  });
 }
}

function buildArena(){
 obstacles=[];
 const spots=[
  [230,175,42],[970,175,42],
  [230,540,42],[970,540,42],
  [600,150,31],[600,565,31],
  [410,355,25],[790,355,25]
 ];
 spots.forEach(([x,y,r])=>obstacles.push({x,y,r}));
}

function toast(text){
 const el=document.getElementById("message");
 el.textContent=text;
 el.style.opacity=1;
 clearTimeout(toastTimeout);
 toastTimeout=setTimeout(()=>el.style.opacity=0,1600);
}

function panel(title,description,info,button,action){
 document.getElementById("title").textContent=title;
 document.getElementById("description").textContent=description;
 document.getElementById("info").innerHTML=info;
 document.getElementById("results").innerHTML="";
 document.getElementById("mainButton").textContent=button;
 document.getElementById("mainButton").onclick=action;
 document.getElementById("overlay").style.display="flex";
}

function showIntro(){
 document.getElementById("arenaName").textContent=theme.name;
 const info=players.map(p=>
  `<div style="color:${p.hero.color}">PLAYER ${p.id}: ${p.hero.name} — ${controls[p.id-1].label}</div>`
 ).join("");
 panel(
  "⚔ MONSTER MAYHEM",
  "Fight your way through five waves of monsters. Work together, collect power-ups and defeat the final boss!",
  info+"<br>3 LIVES EACH · 5 WAVES · FINAL BOSS",
  "START BATTLE",startGame
 );
}

function startGame(){
 makePlayers();
 buildArena();
 enemies=[];pickups=[];particles=[];
 wave=1;coins=0;teamXP=0;teamLevel=1;
 shake=0;elapsed=0;
 state="running";
 document.getElementById("overlay").style.display="none";
 startWave();
 updateHUD();
 last=0;
 requestAnimationFrame(loop);
}

function startWave(){
 enemies=[];
 remaining=4+wave*2+(wave===5?1:0);
 spawnClock=.2;
 toast(wave===5?"FINAL WAVE! THE BOSS IS HERE!":"WAVE "+wave+" — FIGHT!");
}

function randomSpawn(){
 const side=Math.floor(Math.random()*4);
 if(side===0)return{x:rand(60,W-60),y:65};
 if(side===1)return{x:rand(60,W-60),y:H-65};
 if(side===2)return{x:65,y:rand(60,H-60)};
 return{x:W-65,y:rand(60,H-60)};
}

function spawnEnemy(){
 // The final enemy in wave 5 is the boss.
 if(wave===5&&remaining===1){
  const p=randomSpawn();
  enemies.push({
   type:"boss",x:p.x,y:p.y,r:48,
   hp:1200,maxHP:1200,
   speed:92,damage:25,
   attackCooldown:1.2,
   color:"#a855f7",boss:true,
   flash:0
  });
  return;
 }

 const roll=Math.random();
 let type="grunt";
 if(wave>=2&&roll>.55)type="runner";
 if(wave>=3&&roll>.79)type="brute";

 const data={
  grunt:{r:19,hp:65,speed:100,damage:12,color:"#ed547a"},
  runner:{r:14,hp:38,speed:165,damage:9,color:"#f973b7"},
  brute:{r:27,hp:165,speed:68,damage:20,color:"#e36b36"}
 }[type];

 const p=randomSpawn();
 const scale=1+(wave-1)*.14;
 enemies.push({
  ...data,type,x:p.x,y:p.y,
  hp:Math.round(data.hp*scale),
  maxHP:Math.round(data.hp*scale),
  speed:data.speed+(wave-1)*5,
  attackCooldown:rand(.2,1.2),
  flash:0,boss:false
 });
}

function dropPickup(x,y){
 const type=Math.random()<.65?"coin":"health";
 pickups.push({x,y,type,life:12,phase:rand(0,6)});
}

function burst(x,y,color,n=12){
 for(let i=0;i<n;i++){
  const a=rand(0,Math.PI*2),s=rand(45,230);
  particles.push({
   x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,
   life:rand(.25,.65),max:.65,color,size:rand(2,6)
  });
 }
}

function attack(p){
 if(state!=="running"||!p.alive||p.attackCooldown>0)return;
 p.attackTime=.22;
 p.attackCooldown=.36;
 p.hitIds=new Set();
 burst(p.x+Math.cos(p.facing)*28,p.y+Math.sin(p.facing)*28,p.hero.color,5);
}

function dash(p){
 if(state!=="running"||!p.alive||p.dashCooldown>0)return;
 let dx=0,dy=0,c=controls[p.id-1];
 if(keys[c.up])dy--;
 if(keys[c.down])dy++;
 if(keys[c.left])dx--;
 if(keys[c.right])dx++;
 if(dx===0&&dy===0){dx=Math.cos(p.facing);dy=Math.sin(p.facing)}
 const length=Math.hypot(dx,dy)||1;
 dx/=length;dy/=length;
 p.x=clamp(p.x+dx*105,30,W-30);
 p.y=clamp(p.y+dy*105,30,H-30);
 p.invuln=.45;
 p.dashCooldown=3.5;
 p.dashTime=.2;
 burst(p.x,p.y,p.hero.color,16);
}

function collide(p){
 for(const o of obstacles){
  const dx=p.x-o.x,dy=p.y-o.y,d=Math.hypot(dx,dy);
  if(d<p.r+o.r){
   const a=Math.atan2(dy,dx);
   p.x=o.x+Math.cos(a)*(p.r+o.r);
   p.y=o.y+Math.sin(a)*(p.r+o.r);
  }
 }
}

function damagePlayer(p,amount){
 if(!p.alive||p.invuln>0)return;
 p.hp-=amount;
 p.invuln=.75;
 shake=6;
 burst(p.x,p.y,"#fb7185",10);
 if(p.hp<=0){
  p.lives--;
  p.hp=0;
  p.alive=false;
  p.downTime=2.5;
  toast("PLAYER "+p.id+" DOWN!");
  burst(p.x,p.y,p.hero.color,25);
  if(players.every(x=>!x.alive&&x.lives<=0)){
   finish(false);
  }
 }
}

function revivePlayers(){
 players.forEach(p=>{
  if(p.alive||p.lives<=0)return;
  p.downTime-=1/60;
  if(p.downTime<=0){
   p.alive=true;
   p.hp=65;
   p.invuln=2;
   p.x=clamp(W/2+rand(-80,80),50,W-50);
   p.y=clamp(H/2+rand(-80,80),50,H-50);
   toast("PLAYER "+p.id+" REVIVED!");
  }
 });
}

function damageEnemy(e,amount){
 e.hp-=amount;
 e.flash=.1;
 if(e.hp<=0){
  coins+=e.boss?100:e.type==="brute"?8:3;
  teamXP+=e.boss?150:25;
  players.forEach(p=>{if(p.alive)p.score+=e.boss?100:e.type==="brute"?8:3});
  dropPickup(e.x,e.y);
  burst(e.x,e.y,e.color,e.boss?45:18);
  e.dead=true;
  while(teamXP>=teamLevel*100){
   teamXP-=teamLevel*100;
   teamLevel++;
   players.forEach(p=>{
    p.maxHP=Math.min(160,p.maxHP+10);
    p.hp=Math.min(p.maxHP,p.hp+25);
    p.damage+=2;
   });
   toast("TEAM LEVEL "+teamLevel+"! DAMAGE AND HEALTH INCREASED!");
  }
 }
}

function update(dt){
 if(state!=="running")return;
 elapsed+=dt;
 revivePlayers();

 // Player controls and attacks
 players.forEach(p=>{
  if(!p.alive)return;
  p.attackCooldown=Math.max(0,p.attackCooldown-dt);
  p.dashCooldown=Math.max(0,p.dashCooldown-dt);
  p.attackTime=Math.max(0,p.attackTime-dt);
  p.invuln=Math.max(0,p.invuln-dt);
  p.dashTime=Math.max(0,p.dashTime-dt);

  const c=controls[p.id-1];
  let dx=0,dy=0;
  if(keys[c.up])dy--;
  if(keys[c.down])dy++;
  if(keys[c.left])dx--;
  if(keys[c.right])dx++;

  p.moving=!!(dx||dy);
  if(p.moving){
   const len=Math.hypot(dx,dy);
   dx/=len;dy/=len;
   p.facing=Math.atan2(dy,dx);
   p.x+=dx*p.speed*dt;
   p.y+=dy*p.speed*dt;
  }
  p.x=clamp(p.x,25,W-25);
  p.y=clamp(p.y,25,H-25);
  collide(p);
 });

 // Melee combat: each swing can hit each monster once.
 players.forEach(p=>{
  if(!p.alive||p.attackTime<=0)return;
  for(const e of enemies){
   if(e.dead||p.hitIds.has(e))continue;
   const dx=e.x-p.x,dy=e.y-p.y;
   const d=Math.hypot(dx,dy);
   const angle=Math.atan2(dy,dx);
   const diff=Math.atan2(Math.sin(angle-p.facing),Math.cos(angle-p.facing));
   const range=e.boss?105:85;
   if(d<range+e.r&&Math.abs(diff)<1.05){
    p.hitIds.add(e);
    damageEnemy(e,p.damage);
    const push=Math.atan2(e.y-p.y,e.x-p.x);
    e.x+=Math.cos(push)*(e.boss?10:23);
    e.y+=Math.sin(push)*(e.boss?10:23);
    burst(e.x,e.y,p.hero.color,7);
   }
  }
 });

 // Enemy AI and attacks
 enemies.forEach(e=>{
  if(e.dead)return;
  e.flash=Math.max(0,e.flash-dt);
  e.attackCooldown-=dt;

  let target=null,best=Infinity;
  players.forEach(p=>{
   if(!p.alive)return;
   const d=Math.hypot(p.x-e.x,p.y-e.y);
   if(d<best){best=d;target=p}
  });
  if(!target)return;

  const dx=target.x-e.x,dy=target.y-e.y;
  const d=Math.hypot(dx,dy)||1;
  const reach=e.boss?68:e.r+target.r+5;

  if(d>reach){
   e.x+=dx/d*e.speed*dt;
   e.y+=dy/d*e.speed*dt;
  }else if(e.attackCooldown<=0){
   damagePlayer(target,e.damage);
   e.attackCooldown=e.boss?1.1:1.3;
   if(e.boss){
    shake=10;
    burst(e.x,e.y,"#c084fc",12);
   }
  }
  e.x=clamp(e.x,e.r,W-e.r);
  e.y=clamp(e.y,e.r,H-e.r);
 });

 enemies=enemies.filter(e=>!e.dead);

 // Collect drops
 pickups.forEach(p=>{
  p.life-=dt;
  p.phase+=dt*4;
  players.forEach(player=>{
   if(!player.alive)return;
   if(Math.hypot(player.x-p.x,player.y-p.y)<player.r+20){
    if(p.type==="coin"){
     coins+=5;
     player.score+=5;
     toast("+5 COINS");
    }else{
     player.hp=Math.min(player.maxHP,player.hp+35);
     toast("HEALTH RESTORED!");
    }
    p.dead=true;
    burst(p.x,p.y,p.type==="coin"?"#facc15":"#4ade80",12);
   }
  });
 });
 pickups=pickups.filter(p=>!p.dead&&p.life>0);

 // Particles
 particles.forEach(p=>{
  p.x+=p.vx*dt;p.y+=p.vy*dt;
  p.vx*=.96;p.vy*=.96;p.life-=dt;
 });
 particles=particles.filter(p=>p.life>0);

 // Spawn waves
 if(remaining>0){
  spawnClock-=dt;
  if(spawnClock<=0){
   spawnEnemy();
   remaining--;
   spawnClock=.75;
  }
 }else if(enemies.length===0){
  if(wave>=5){
   finish(true);
   return;
  }
  if(breakTime===0){
   breakTime=3;
   toast("WAVE CLEARED! GET READY!");
  }
  breakTime-=dt;
  if(breakTime<=0){
   wave++;
   breakTime=0;
   startWave();
  }
 }

 updateHUD();
}

function updateHUD(){
 document.getElementById("wave").textContent=wave+"/5";
 document.getElementById("coins").textContent=coins;
 document.getElementById("monsterCount").textContent=enemies.length+remaining;
 document.getElementById("level").textContent=teamLevel;

 const boss=enemies.find(e=>e.boss);
 const bar=document.getElementById("bossBar");
 if(boss){
  bar.style.display="block";
  document.getElementById("bossFill").style.width=
   clamp(boss.hp/boss.maxHP*100,0,100)+"%";
 }else{
  bar.style.display="none";
 }
}

function drawBackground(){
 ctx.fillStyle=theme.floor;
 ctx.fillRect(0,0,W,H);
 ctx.strokeStyle=theme.grid;
 ctx.lineWidth=1;
 for(let x=0;x<W;x+=40){
  ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();
 }
 for(let y=0;y<H;y+=40){
  ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
 }
 ctx.save();
 ctx.strokeStyle=theme.glow;
 ctx.lineWidth=4;
 ctx.shadowColor=theme.glow;
 ctx.shadowBlur=17;
 ctx.strokeRect(6,6,W-12,H-12);
 ctx.restore();

 // Arena-specific decorations
 for(let i=0;i<9;i++){
  const x=70+i*135;
  ctx.fillStyle=theme.glow+"25";
  ctx.beginPath();
  ctx.arc(x,45,7+Math.sin(elapsed*2+i)*2,0,Math.PI*2);
  ctx.fill();
 }
}

function drawObstacle(o){
 ctx.save();
 ctx.shadowColor=theme.glow;
 ctx.shadowBlur=13;
 ctx.fillStyle=theme.obstacle;
 ctx.beginPath();
 ctx.arc(o.x,o.y,o.r,0,Math.PI*2);
 ctx.fill();
 ctx.shadowBlur=0;
 ctx.strokeStyle=theme.accent;
 ctx.lineWidth=3;
 ctx.stroke();
 ctx.strokeStyle=theme.glow;
 ctx.lineWidth=2;
 ctx.beginPath();
 ctx.arc(o.x,o.y,o.r-9,0,Math.PI*2);
 ctx.stroke();
 ctx.restore();
}

function drawPlayer(p){
 if(!p.alive)return;
 ctx.save();
 ctx.translate(p.x,p.y);
 const bob=p.moving?Math.sin(elapsed*15+p.id)*3:Math.sin(elapsed*3+p.id)*1.5;
 ctx.translate(0,bob);

 if(p.invuln>0&&Math.floor(elapsed*15)%2===0)ctx.globalAlpha=.45;

 // Shadow
 ctx.fillStyle="#0008";
 ctx.beginPath();ctx.ellipse(0,18,23,8,0,0,Math.PI*2);ctx.fill();

 // Backpack
 ctx.fillStyle=p.hero.dark;
 ctx.beginPath();ctx.roundRect(-22,-8,11,26,5);ctx.fill();

 // Feet
 ctx.fillStyle="#20253a";
 ctx.beginPath();
 ctx.roundRect(-15,12,12,12,4);
 ctx.roundRect(4,12,12,12,4);
 ctx.fill();

 // Body
 ctx.shadowColor=p.hero.color;
 ctx.shadowBlur=18;
 ctx.fillStyle=p.hero.color;
 ctx.beginPath();ctx.roundRect(-19,-18,38,39,13);ctx.fill();
 ctx.shadowBlur=0;

 // Body highlight
 ctx.fillStyle="#ffffff66";
 ctx.beginPath();ctx.roundRect(-13,-13,7,24,4);ctx.fill();

 // Helmet
 ctx.fillStyle=p.hero.dark;
 ctx.beginPath();ctx.roundRect(-19,-27,38,27,12);ctx.fill();

 // Visor
 ctx.fillStyle="#183148";
 ctx.beginPath();ctx.roundRect(-14,-23,28,16,7);ctx.fill();
 ctx.fillStyle="#c6f6ff";
 ctx.beginPath();ctx.roundRect(-10,-20,20,7,4);ctx.fill();

 // Belt
 ctx.fillStyle="#e2e8f0";
 ctx.beginPath();ctx.roundRect(-11,5,22,5,2);ctx.fill();

 // Weapon
 ctx.save();
 ctx.rotate(p.facing);
 ctx.fillStyle="#d5d9eb";
 ctx.beginPath();ctx.roundRect(11,-5,22,7,3);ctx.fill();
 ctx.fillStyle=p.hero.color;
 ctx.fillRect(14,-3,14,3);
 ctx.restore();

 // Attack arc
 if(p.attackTime>0){
  ctx.strokeStyle=p.hero.color;
  ctx.lineWidth=9;
  ctx.globalAlpha=.8;
  ctx.beginPath();
  ctx.arc(0,0,58,p.facing-.9,p.facing+.9);
  ctx.stroke();
  ctx.globalAlpha=1;
 }

 // Dash effect
 if(p.dashTime>0){
  ctx.strokeStyle="#ffffff";
  ctx.lineWidth=4;
  ctx.beginPath();ctx.arc(0,0,33,0,Math.PI*2);ctx.stroke();
 }

 ctx.restore();

 // Health bar
 ctx.fillStyle="#261d30";
 ctx.fillRect(p.x-24,p.y-44,48,6);
 ctx.fillStyle=p.hp>40?"#4ade80":"#fb7185";
 ctx.fillRect(p.x-24,p.y-44,48*clamp(p.hp/p.maxHP,0,1),6);

 ctx.fillStyle="white";
 ctx.font="bold 11px Arial";
 ctx.textAlign="center";
 ctx.fillText("P"+p.id,p.x,p.y-50);
}

function drawEnemy(e){
 ctx.save();
 ctx.translate(e.x,e.y);
 const pulse=1+Math.sin(elapsed*5+e.x)*.035;
 ctx.scale(pulse,pulse);
 const c=e.color;
 ctx.shadowColor=c;
 ctx.shadowBlur=e.boss?30:17;
 ctx.fillStyle=e.flash>0?"white":c;

 if(e.boss){
  // Boss monster
  ctx.beginPath();
  for(let i=0;i<12;i++){
   const a=i*Math.PI/6;
   const r=i%2===0?53:43;
   const x=Math.cos(a)*r,y=Math.sin(a)*r;
   if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  }
  ctx.closePath();ctx.fill();
  ctx.strokeStyle="#e9d5ff";ctx.lineWidth=4;ctx.stroke();
  ctx.fillStyle="#f0abfc";
  ctx.beginPath();ctx.arc(-17,-10,9,0,Math.PI*2);ctx.arc(17,-10,9,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#281238";
  ctx.beginPath();ctx.arc(-17,-10,4,0,Math.PI*2);ctx.arc(17,-10,4,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#fff";
  ctx.font="bold 12px Arial";ctx.textAlign="center";
  ctx.fillText("BOSS",0,73);
 }else{
  ctx.beginPath();ctx.arc(0,0,e.r,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle="#ffffff77";ctx.lineWidth=2;ctx.stroke();
  // Horns
  ctx.fillStyle=e.color;
  ctx.beginPath();
  ctx.moveTo(-e.r*.6,-e.r*.5);
  ctx.lineTo(-e.r*.95,-e.r*1.3);
  ctx.lineTo(-e.r*.1,-e.r*.7);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(e.r*.6,-e.r*.5);
  ctx.lineTo(e.r*.95,-e.r*1.3);
  ctx.lineTo(e.r*.1,-e.r*.7);
  ctx.fill();
  // Eyes
  ctx.fillStyle="#fff";
  ctx.beginPath();
  ctx.arc(-e.r*.35,-e.r*.1,4,0,Math.PI*2);
  ctx.arc(e.r*.35,-e.r*.1,4,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle="#241126";
  ctx.beginPath();
  ctx.arc(-e.r*.35,-e.r*.1,2,0,Math.PI*2);
  ctx.arc(e.r*.35,-e.r*.1,2,0,Math.PI*2);
  ctx.fill();
 }
 ctx.restore();

 if(!e.boss){
  ctx.fillStyle="#261a2c";
  ctx.fillRect(e.x-e.r,e.y-e.r-11,e.r*2,4);
  ctx.fillStyle="#fb7185";
  ctx.fillRect(e.x-e.r,e.y-e.r-11,e.r*2*clamp(e.hp/e.maxHP,0,1),4);
 }
}

function drawPickups(){
 pickups.forEach(p=>{
  const bob=Math.sin(elapsed*5+p.phase)*4;
  ctx.save();
  ctx.translate(p.x,p.y+bob);
  ctx.shadowColor=p.type==="coin"?"#facc15":"#4ade80";
  ctx.shadowBlur=20;
  ctx.fillStyle=p.type==="coin"?"#facc15":"#4ade80";
  ctx.beginPath();ctx.arc(0,0,13,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;
  ctx.fillStyle="#243047";
  ctx.font="bold 15px Arial";
  ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText(p.type==="coin"?"$":"+",0,1);
  ctx.restore();
 });
}

function drawParticles(){
 particles.forEach(p=>{
  ctx.globalAlpha=clamp(p.life/p.max,0,1);
  ctx.fillStyle=p.color;
  ctx.fillRect(p.x,p.y,p.size,p.size);
 });
 ctx.globalAlpha=1;
}

function drawBottomHUD(){
 players.forEach((p,i)=>{
  const x=15+i*188,y=H-53;
  ctx.fillStyle="#080b19dd";
  ctx.beginPath();ctx.roundRect(x,y,175,39,7);ctx.fill();
  ctx.fillStyle=p.hero.color;
  ctx.fillRect(x+7,y+7,5,25);
  ctx.fillStyle="white";
  ctx.font="bold 11px Arial";
  ctx.textAlign="left";
  ctx.fillText("P"+p.id+" "+p.hero.name,x+18,y+15);
  ctx.fillStyle="#34394e";
  ctx.fillRect(x+18,y+21,110,6);
  ctx.fillStyle=p.hp>40?"#4ade80":"#fb7185";
  ctx.fillRect(x+18,y+21,110*clamp(p.hp/p.maxHP,0,1),6);
  ctx.fillStyle="#fda4af";
  ctx.fillText("♥ "+p.lives,x+137,y+27);
  if(!p.alive&&p.lives>0){
   ctx.fillStyle="#fb7185";
   ctx.fillText("DOWN",x+137,y+12);
  }
 });
}

function draw(){
 ctx.save();
 if(shake>0){
  ctx.translate(rand(-shake,shake),rand(-shake,shake));
  shake=Math.max(0,shake-.4);
 }
 drawBackground();
 obstacles.forEach(drawObstacle);
 drawPickups();
 enemies.forEach(drawEnemy);
 players.forEach(drawPlayer);
 drawParticles();
 drawBottomHUD();
 ctx.restore();
}

function finish(won){
 state=won?"won":"lost";
 const ranked=[...players].sort((a,b)=>b.score-a.score);
 document.getElementById("bossBar").style.display="none";
 const rows=ranked.map((p,i)=>
  `<div class="result">
   <span style="color:${p.hero.color}">${i===0?"🏆 ":""}P${p.id} ${p.hero.name}</span>
   <span>${p.score} pts · ${p.lives} lives</span>
  </div>`
 ).join("");
 panel(
  won?"🏆 ARENA CLEARED!":"💀 TEAM DEFEATED",
  won?"You defeated the final boss! Your team are arena champions!":"Your team has been defeated. The monsters won this round.",
  "WAVES COMPLETED: "+(won?5:wave)+"<br>TEAM COINS: "+coins,
  "PLAY AGAIN",startGame
 );
 document.getElementById("results").innerHTML=rows;
}

function pauseGame(){
 if(state==="running"){
  state="paused";
  panel("⏸ PAUSED","The battle is paused. Take a break.","WAVE "+wave+" · "+theme.name,"RESUME",resumeGame);
 }else if(state==="paused"){
  resumeGame();
 }
}

function resumeGame(){
 state="running";
 document.getElementById("overlay").style.display="none";
 last=0;
 requestAnimationFrame(loop);
}

function home(){
 state="intro";
 location.href="index.html";
}

window.addEventListener("keydown",e=>{
 const k=e.key.toLowerCase();
 if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(k))e.preventDefault();
 if(keys[k])return;
 keys[k]=true;
 if(state!=="running")return;
 players.forEach(p=>{
  const c=controls[p.id-1];
  if(k===c.attack)attack(p);
  if(k===c.dash)dash(p);
 });
 if(k==="escape")pauseGame();
});

window.addEventListener("keyup",e=>{
 keys[e.key.toLowerCase()]=false;
});

window.addEventListener("blur",()=>{keys={}});

function loop(timestamp){
 if(state!=="running")return;
 const dt=last?Math.min((timestamp-last)/1000,.033):.016;
 last=timestamp;
 update(dt);
 draw();
 if(state==="running")requestAnimationFrame(loop);
}

makePlayers();
buildArena();
showIntro();
updateHUD();
draw();
</script>
</body>
</html>
