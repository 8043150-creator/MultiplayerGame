
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON ARENA - GAME</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080914;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

header {
    height: 65px;
    background: #111225;
    border-bottom: 1px solid #30314b;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 20px;
}

header h2 {
    color: #a78bfa;
    letter-spacing: 3px;
}

header button {
    padding: 9px 15px;
    border: 1px solid #484866;
    background: #202139;
    color: white;
    border-radius: 8px;
    cursor: pointer;
}

#hud {
    display: flex;
    justify-content: center;
    gap: 25px;
    padding: 12px;
    flex-wrap: wrap;
    background: #111225;
    font-size: 14px;
}

#gameArea {
    position: relative;
    width: 100%;
    height: calc(100vh - 115px);
    display: flex;
    align-items: center;
    justify-content: center;
}

canvas {
    width: min(100%, 1100px);
    height: 100%;
    object-fit: contain;
    background: #101326;
}

#overlay {
    position: absolute;
    inset: 0;
    background: #070817eF;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    z-index: 5;
}

.panel {
    background: #17182d;
    border: 1px solid #48436f;
    border-radius: 20px;
    padding: 35px;
    width: 90%;
    max-width: 450px;
    box-shadow: 0 0 45px #7c3aed33;
}

.panel h1 {
    color: #a78bfa;
    font-size: 34px;
}

.panel button {
    background: linear-gradient(90deg,#7c3aed,#2563eb);
    color: white;
    padding: 14px 35px;
    border: none;
    border-radius: 10px;
    font-size: 17px;
    cursor: pointer;
    margin-top: 20px;
}

#playersList {
    margin: 20px 0;
    line-height: 2;
    color: #c7c7e5;
}

#mobileControls {
    display: none;
}

@media(max-width:650px) {
    #hud { gap: 10px; font-size: 11px; }
    header h2 { font-size: 17px; }
    .panel { padding: 22px; }
}
</style>
</head>

<body>

<header>
    <h2>⚡ NEON ARENA</h2>
    <button onclick="location.href='index.html'">EXIT GAME</button>
</header>

<div id="hud">
    <span id="round">ROUND 1</span>
    <span id="timer">TIME: 60</span>
    <span id="coins">💎 GEMS: 0</span>
    <span id="status">GET READY!</span>
</div>

<div id="gameArea">

<canvas id="game" width="1100" height="650"></canvas>

<div id="overlay">
    <div class="panel">
        <h1 id="overlayTitle">NEON ARENA</h1>
        <p id="overlayText">Get ready to enter the arena!</p>
        <div id="playersList"></div>
        <button id="startButton" onclick="startGame()">START GAME</button>
    </div>
</div>

</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const W = canvas.width;
const H = canvas.height;

const params = new URLSearchParams(location.search);
const playerCount = Math.max(1, Math.min(4,
    Number(params.get("players")) || 1
));

const colors = ["#a855f7","#38bdf8","#facc15","#fb7185"];

const controls = [
    {up:"w",down:"s",left:"a",right:"d"},
    {up:"arrowup",down:"arrowdown",left:"arrowleft",right:"arrowright"},
    {up:"i",down:"k",left:"j",right:"l"},
    {up:"t",down:"g",left:"f",right:"h"}
];

const keys = {};

let players = [];
let gems = [];
let enemies = [];
let particles = [];

let playing = false;
let gameOver = false;
let round = 1;
let timeLeft = 60;
let totalGems = 0;
let frame = 0;
let lastTime = 0;
let timerInterval;

function setupPlayers() {
    players = [];

    const positions = [
        [W/2-80,H/2],
        [W/2+80,H/2],
        [W/2,H/2-80],
        [W/2,H/2+80]
    ];

    for(let i=0;i<playerCount;i++) {
        players.push({
            x:positions[i][0],
            y:positions[i][1],
            r:16,
            speed:3.4,
            score:0,
            alive:true,
            shield:0,
            color:colors[i],
            name:"PLAYER "+(i+1),
            controls:controls[i]
        });
    }
}

function randomPosition() {
    return {
        x:50+Math.random()*(W-100),
        y:50+Math.random()*(H-100)
    };
}

function spawnGem() {
    const p = randomPosition();

    gems.push({
        x:p.x,
        y:p.y,
        r:10,
        color:"#facc15",
        value:1
    });
}

function spawnEnemy() {
    const p = randomPosition();

    enemies.push({
        x:p.x,
        y:p.y,
        r:15,
        speed:0.9+round*0.12,
        angle:Math.random()*Math.PI*2,
        pulse:0
    });
}

function spawnParticles(x,y,color) {
    for(let i=0;i<9;i++) {
        particles.push({
            x,y,
            vx:(Math.random()-.5)*6,
            vy:(Math.random()-.5)*6,
            life:30,
            color
        });
    }
}

function startGame() {
    setupPlayers();

    gems = [];
    enemies = [];
    particles = [];

    for(let i=0;i<12;i++) spawnGem();
    for(let i=0;i<3;i++) spawnEnemy();

    round = 1;
    timeLeft = 60;
    totalGems = 0;
    frame = 0;
    playing = true;
    gameOver = false;

    document.getElementById("overlay").style.display="none";

    clearInterval(timerInterval);

    timerInterval = setInterval(()=>{
        if(!playing) return;

        timeLeft--;

        if(timeLeft <= 0) {
            nextRound();
        }

        updateHUD();
    },1000);

    updateHUD();
    lastTime = 0;
    requestAnimationFrame(loop);
}

function nextRound() {
    round++;
    timeLeft = 60;

    for(let i=0;i<3;i++) spawnEnemy();
    for(let i=0;i<5;i++) spawnGem();

    updateHUD();
}

function updateHUD() {
    document.getElementById("round").textContent="ROUND "+round;
    document.getElementById("timer").textContent="TIME: "+timeLeft;
    document.getElementById("coins").textContent="💎 GEMS: "+totalGems;
    document.getElementById("status").textContent=
        players.filter(p=>p.alive).length+" PLAYERS ACTIVE";
}

function update(dt) {
    if(!playing) return;

    frame++;

    players.forEach((p)=>{
        if(!p.alive) return;

        let c = p.controls;
        let dx=0,dy=0;

        if(keys[c.up]) dy--;
        if(keys[c.down]) dy++;
        if(keys[c.left]) dx--;
        if(keys[c.right]) dx++;

        if(dx!==0 && dy!==0) {
            dx*=0.707;
            dy*=0.707;
        }

        p.x+=dx*p.speed*dt;
        p.y+=dy*p.speed*dt;

        p.x=Math.max(p.r,Math.min(W-p.r,p.x));
        p.y=Math.max(p.r,Math.min(H-p.r,p.y));

        if(p.shield>0) p.shield-=dt;

        gems.forEach((g,index)=>{
            const distance=Math.hypot(p.x-g.x,p.y-g.y);

            if(distance<p.r+g.r) {
                p.score++;
                totalGems++;
                spawnParticles(g.x,g.y,"#facc15");
                gems.splice(index,1);
                spawnGem();
            }
        });
    });

    enemies.forEach(e=>{
        let target=null;
        let best=Infinity;

        players.forEach(p=>{
            if(!p.alive) return;

            const d=Math.hypot(p.x-e.x,p.y-e.y);

            if(d<best) {
                best=d;
                target=p;
            }
        });

        if(target) {
            const angle=Math.atan2(target.y-e.y,target.x-e.x);

            e.x+=Math.cos(angle)*e.speed*dt;
            e.y+=Math.sin(angle)*e.speed*dt;
        }

        players.forEach(p=>{
            if(!p.alive) return;

            const d=Math.hypot(p.x-e.x,p.y-e.y);

            if(d<p.r+e.r) {
                if(p.shield>0) {
                    e.x-=Math.cos(Math.atan2(p.y-e.y,p.x-e.x))*18;
                    e.y-=Math.sin(Math.atan2(p.y-e.y,p.x-e.x))*18;
                } else {
                    p.alive=false;
                    spawnParticles(p.x,p.y,p.color);
                }
            }
        });
    });

    particles.forEach(p=>{
        p.x+=p.vx*dt;
        p.y+=p.vy*dt;
        p.life-=dt;
    });

    particles=particles.filter(p=>p.life>0);

    if(players.every(p=>!p.alive)) {
        endGame();
    }
}

function drawBackground() {
    ctx.fillStyle="#101326";
    ctx.fillRect(0,0,W,H);

    ctx.strokeStyle="#252944";
    ctx.lineWidth=1;

    for(let x=0;x<W;x+=40) {
        ctx.beginPath();
        ctx.moveTo(x,0);
        ctx.lineTo(x,H);
        ctx.stroke();
    }

    for(let y=0;y<H;y+=40) {
        ctx.beginPath();
        ctx.moveTo(0,y);
        ctx.lineTo(W,y);
        ctx.stroke();
    }

    ctx.strokeStyle="#7655c8";
    ctx.lineWidth=3;
    ctx.strokeRect(5,5,W-10,H-10);
}

function draw() {
    drawBackground();

    gems.forEach(g=>{
        ctx.save();
        ctx.shadowBlur=20;
        ctx.shadowColor=g.color;
        ctx.fillStyle=g.color;

        ctx.beginPath();
        ctx.moveTo(g.x,g.y-12);
        ctx.lineTo(g.x+9,g.y);
        ctx.lineTo(g.x,g.y+12);
        ctx.lineTo(g.x-9,g.y);
        ctx.closePath();
        ctx.fill();

        ctx.restore();
    });

    enemies.forEach(e=>{
        ctx.save();
        ctx.shadowBlur=18;
        ctx.shadowColor="#fb4d70";
        ctx.fillStyle="#fb4d70";

        ctx.beginPath();
        ctx.arc(e.x,e.y,e.r,0,Math.PI*2);
        ctx.fill();

        ctx.fillStyle="white";
        ctx.beginPath();
        ctx.arc(e.x-5,e.y-3,3,0,Math.PI*2);
        ctx.arc(e.x+5,e.y-3,3,0,Math.PI*2);
        ctx.fill();
        ctx.restore();
    });

    players.forEach((p,i)=>{
        if(!p.alive) return;

        ctx.save();
        ctx.shadowBlur=25;
        ctx.shadowColor=p.color;
        ctx.fillStyle=p.color;

        ctx.beginPath();
        ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fill();

        if(p.shield>0) {
            ctx.strokeStyle="#67e8f9";
            ctx.lineWidth=4;
            ctx.beginPath();
            ctx.arc(p.x,p.y,p.r+8,0,Math.PI*2);
            ctx.stroke();
        }

        ctx.shadowBlur=0;
        ctx.fillStyle="white";
        ctx.font="bold 11px Arial";
        ctx.textAlign="center";
        ctx.fillText("P"+(i+1),p.x,p.y-25);

        ctx.restore();
    });

    particles.forEach(p=>{
        ctx.globalAlpha=p.life/30;
        ctx.fillStyle=p.color;
        ctx.fillRect(p.x,p.y,5,5);
        ctx.globalAlpha=1;
    });

    drawScoreboard();
}

function drawScoreboard() {
    ctx.fillStyle="#080914cc";
    ctx.fillRect(15,15,165,playerCount*30+15);

    players.forEach((p,i)=>{
        ctx.fillStyle=p.color;
        ctx.font="bold 14px Arial";
        ctx.textAlign="left";

        ctx.fillText(
            p.name+"  "+p.score+" gems"+(p.alive?"":"  OUT"),
            25,38+i*30
        );
    });
}

function loop(timestamp) {
    if(!playing) return;

    const dt=lastTime ? Math.min((timestamp-lastTime)/16.67,2):1;
    lastTime=timestamp;

    update(dt);
    draw();

    if(playing) requestAnimationFrame(loop);
}

function endGame() {
    playing=false;
    gameOver=true;
    clearInterval(timerInterval);

    const sorted=[...players].sort((a,b)=>b.score-a.score);
    const winner=sorted[0];

    document.getElementById("overlayTitle").textContent="🏆 GAME OVER";

    document.getElementById("overlayText").textContent=
        winner.name+" WINS WITH "+winner.score+" GEMS!";

    document.getElementById("playersList").innerHTML=
        sorted.map((p,i)=>
            `<div>${i+1}. ${p.name} — ${p.score} gems</div>`
        ).join("");

    document.getElementById("startButton").textContent="PLAY AGAIN";
    document.getElementById("overlay").style.display="flex";
}

function showInstructions() {
    document.getElementById("overlayTitle").textContent="READY TO PLAY?";

    document.getElementById("overlayText").textContent=
        "Collect gems, avoid the red enemies and survive as long as possible!";

    document.getElementById("playersList").innerHTML=
        players.map((p,i)=>
        `<div style="color:${colors[i]}">
        ${p.name}: ${Object.entries(controls[i])
        .map(([a,b])=>a.toUpperCase()+": "+b.toUpperCase())
        .join(" | ")}
        </div>`).join("");
}

window.addEventListener("keydown",e=>{
    const key=e.key.toLowerCase();

    if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(key)) {
        e.preventDefault();
    }

    keys[key]=true;
});

window.addEventListener("keyup",e=>{
    keys[e.key.toLowerCase()]=false;
});

window.addEventListener("blur",()=>{
    Object.keys(keys).forEach(k=>keys[k]=false);
});

setupPlayers();
showInstructions();

</script>

</body>
</html>
