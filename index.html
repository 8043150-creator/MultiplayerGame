
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON ARENA</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #080914;
    color: white;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
    radial-gradient(circle at 20% 30%, #5224a533, transparent 40%),
    radial-gradient(circle at 80% 70%, #087cbd33, transparent 40%);
    z-index: -1;
}

.container {
    width: 92%;
    max-width: 900px;
    text-align: center;
    padding: 35px 15px;
}

.logo {
    font-size: clamp(45px, 9vw, 85px);
    font-weight: 1000;
    letter-spacing: 5px;
    color: #fff;
    text-shadow: 0 0 15px #8b5cf6, 0 0 40px #6d28d9;
}

.subtitle {
    color: #aaaac5;
    margin: 12px 0 35px;
    letter-spacing: 4px;
    font-size: 12px;
}

.section-title {
    margin-bottom: 18px;
    font-size: 17px;
    color: #b9b4d5;
    letter-spacing: 2px;
}

.modes {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
}

.mode {
    background: #17182b;
    border: 2px solid #30314c;
    border-radius: 15px;
    padding: 23px 8px;
    cursor: pointer;
    transition: .2s;
    color: white;
}

.mode:hover, .mode.active {
    border-color: #a78bfa;
    background: #292044;
    transform: translateY(-5px);
    box-shadow: 0 0 20px #8b5cf644;
}

.mode .emoji {
    font-size: 35px;
    margin-bottom: 12px;
}

.mode h3 {
    font-size: 17px;
}

.mode p {
    color: #aaa;
    font-size: 12px;
    margin-top: 7px;
}

.play {
    margin-top: 35px;
    padding: 18px 65px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(90deg, #7c3aed, #2563eb);
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 0 25px #7c3aed66;
    transition: .2s;
}

.play:hover {
    transform: scale(1.06);
}

.instructions {
    margin-top: 30px;
    color: #85859f;
    font-size: 12px;
    line-height: 2;
}

@media(max-width:600px) {
    .modes {
        grid-template-columns: repeat(2, 1fr);
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">NEON ARENA</div>
    <div class="subtitle">ONE ARENA. FOUR PLAYERS. ENDLESS CHAOS.</div>

    <div class="section-title">SELECT YOUR GAME MODE</div>

    <div class="modes">

        <div class="mode active" onclick="selectMode(1,this)">
            <div class="emoji">👤</div>
            <h3>SOLO</h3>
            <p>1 Player</p>
        </div>

        <div class="mode" onclick="selectMode(2,this)">
            <div class="emoji">👥</div>
            <h3>DUOS</h3>
            <p>2 Players</p>
        </div>

        <div class="mode" onclick="selectMode(3,this)">
            <div class="emoji">⚡</div>
            <h3>TRIOS</h3>
            <p>3 Players</p>
        </div>

        <div class="mode" onclick="selectMode(4,this)">
            <div class="emoji">🏆</div>
            <h3>SQUADS</h3>
            <p>4 Players</p>
        </div>

    </div>

    <button class="play" onclick="startGame()">PLAY NOW →</button>

    <div class="instructions">
        LOCAL MULTIPLAYER • SAME COMPUTER<br>
        COLLECT • DODGE • SURVIVE • WIN
    </div>

</div>

<script>
let selectedPlayers = 1;

function selectMode(players, element) {
    selectedPlayers = players;

    document.querySelectorAll(".mode").forEach(m => {
        m.classList.remove("active");
    });

    element.classList.add("active");
}

function startGame() {
    window.location.href = "game.html?players=" + selectedPlayers;
}
</script>

</body>
</html>
